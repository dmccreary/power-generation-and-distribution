# Intelligent Textbook — MkDocs Material configuration.
# Generated by the init-textbook skill. Customize as the book grows.
# Use the book-installer skill to add features incrementally
# (math, mascot, slides, learning graph viewer, etc.).

site_name: 'Power Generation and Distribution'
site_description: 'An interactive intelligent textbook that follows electric power from generation through transmission and distribution to the building service entrance, written for electrical designers.'
site_author: 'Polly Friendshuh with assistance from Dan McCreary'
site_url: 'https://dmccreary.github.io/power-generation-and-distribution/'

# Hooks — runs local Python before/after page processing.
# `plugins/social_override.py` injects og:title, og:description, og:image,
# og:type, og:url, and twitter:* meta tags on every page using each page's
# frontmatter `title:` / `description:` / `image:` (falling back to the site-
# wide values and `img/cover.png`). This is the Cairo-free path to social-
# media previews — works without `pip install "mkdocs-material[imaging]"`.
# If the `social` plugin below is ever enabled, the same hook also rewrites
# its auto-generated `/assets/images/social/...` URLs to point at the
# declared cover image. Verify the result with `bk-check-social-cover`.
hooks:
  - plugins/social_override.py

# Repository
repo_name: 'GitHub Repo'
repo_url: 'https://github.com/dmccreary/power-generation-and-distribution'
edit_uri: 'blob/main/docs'

# Copyright
copyright: 'Copyright &copy; 2026 Polly Friendshuh. Licensed under <a href="license/">CC BY-NC-SA 4.0</a> for non-commercial use.'

# Navigation
# IMPORTANT: do NOT add `navigation.tabs` — these books use side navigation
# optimized for wide landscape screens.
nav:
  - Home: index.md
  - About: about.md
  - Course Description: course-description.md

  - Chapters:
      - List of Chapters: chapters/index.md
      - 1. Electrical Foundations: chapters/01-electrical-foundations/index.md
      - 2. AC Circuits and Power Factor: chapters/02-ac-circuits-power-factor/index.md
      - 3. Three-Phase Systems and Power-System Representation: chapters/03-three-phase-system-representation/index.md
      - 4. Grid Architecture and System Operations: chapters/04-grid-architecture-operations/index.md
      - 5. Loads, Demand, and Facility Profiles: chapters/05-loads-demand-profiles/index.md
      - 6. Utility Rates and Project Economics: chapters/06-utility-rates-project-economics/index.md
      - 7. Generators and Prime Movers: chapters/07-generators-prime-movers/index.md
      - 8. Thermal and Nuclear Generation: chapters/08-thermal-nuclear-generation/index.md
      - 9. Hydroelectric and Wind Generation: chapters/09-hydroelectric-wind-generation/index.md
      - 10. Solar and Emerging Renewable Technologies: chapters/10-solar-emerging-renewables/index.md
      - 11. Energy Storage and Generation Evaluation: chapters/11-energy-storage-generation-evaluation/index.md
      - 12. Faults, Grounding, and Overcurrent Fundamentals: chapters/12-faults-grounding-overcurrent/index.md
      - 13. Transformers and Instrument-Based Protection: chapters/13-transformers-instrument-protection/index.md
      - 14. Transmission Systems and Grid Oversight: chapters/14-transmission-grid-oversight/index.md
      - 15. Substations and Protection Coordination: chapters/15-substations-protection-coordination/index.md
      - 16. Distribution Systems and Equipment: chapters/16-distribution-systems-equipment/index.md
      - 17. Distribution Performance and Reliability: chapters/17-distribution-reliability/index.md
      - 18. Building Service, Metering, Automation, and Backup Power: chapters/18-building-service-metering-backup/index.md
      - 19. Standards, Distributed Energy, and Microgrids: chapters/19-standards-der-microgrids/index.md
      - 20. Efficiency, Sustainability, and Design Synthesis: chapters/20-efficiency-sustainable-design/index.md

  - Learning Graph:
      - Introduction: learning-graph/index.md
      # Generated by learning-graph-generator skill:
      - Course Description Assessment: learning-graph/course-description-assessment.md
      - Concept Enumeration: learning-graph/concept-list.md
      - Concept Taxonomy: learning-graph/concept-taxonomy.md
      - Graph Quality Analysis: learning-graph/quality-metrics.md
      - Taxonomy Distribution: learning-graph/taxonomy-distribution.md
      - Relay Mascot Test: learning-graph/mascot-test.md

  - MicroSims:
    - List of MicroSims: sims/index.md
    - AC Impedance and Phase Explorer: sims/ac-impedance-phase-explorer/index.md
    - AC Power Triangle and Power Factor Calculator: sims/ac-power-triangle-calculator/index.md
    - AC Waveform Measurement Explorer: sims/ac-waveform-measurement-explorer/index.md
    - Circuit Quantity Explorer: sims/circuit-quantity-explorer/index.md
    - Current and Magnetic Field Explorer: sims/current-magnetic-field-explorer/index.md
    - Electrical Power and Energy Calculator: sims/electrical-power-energy-calculator/index.md
    - Learning Graph Viewer: sims/graph-viewer/index.md
    - Power System Path Explorer: sims/power-system-path-explorer/index.md
    - RMS Explorer: sims/rms-explorer/index.md





  - License: license.md
  - Contact: contact.md

# Theme configuration
theme:
  name: material
  # Once a logo is generated, point this at docs/img/logo.png or a mascot pose:
  logo: img/mascot/welcome.png
  favicon: img/favicon.ico
  palette:
    primary: 'indigo'
    accent: 'orange'
  include_sidebar: true
  features:
    - content.code.copy
    - content.action.edit
    - navigation.expand
    - navigation.path
    - navigation.prune
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share

# Plugins
plugins:
  - search
  # Uncomment after running `pip install "mkdocs-material[imaging]"`:
  # - social
  # Uncomment after running `pip install mkdocs-glightbox`:
  # - glightbox:
  #     touchNavigation: true
  #     loop: false
  #     effect: zoom
  #     slide_effect: slide
  #     width: 100%
  #     height: auto
  #     zoomable: true
  #     draggable: true
  #     auto_caption: false
  #     caption_position: bottom
  #     skip_classes:
  #       - mascot-admonition-img   # keep mascot poses out of the lightbox gallery

# Markdown extensions
markdown_extensions:
  - md_in_html
  - admonition
  - attr_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.arithmatex:
      generic: true
      # Currency-safe: only backslash delimiters are treated as math.
      inline_syntax: ['round']
      block_syntax: ['square']

# Custom CSS — file is created by init-textbook
extra_css:
  - css/extra.css
  - css/mascot.css
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css

# Custom JavaScript
extra_javascript:
  - js/katex.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js
  - https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js

# Exclude prompt scratch files and TODOs from build/search/sitemap
exclude_docs: |
  **/image-prompt*.md
  **/image-prompts*.md
  **/cover-image-prompt.md
  **/cover-prompt.md
  **/TODO.md

# Rebuild on changes during `mkdocs serve`
watch:
  - docs
  - mkdocs.yml

# Extra
extra:
  # Suppress the "Made with Material for MkDocs" footer line
  generator: false

  # MicroSim build-status indicators shown next to nav entries.
  # The status value is set per-page in the index.md frontmatter:
  #   status: scaffold | built | implemented | instrumented | approved
  # `instrumented` = the sim carries xAPI event handling (main.html loads lrs-sim.js and
  # the code calls LRSSim.create); the add-xapi-events-to-microsim skill's
  # scripts/sync-status.py sets it. Its icon is always the teal "signal" (MDI access-point).
  # Colors are defined as CSS custom properties in docs/css/extra.css.
  # Note: `theme.icon.status` is a Material Insiders feature and is silently
  # ignored on community Material. Do not add it — the CSS-variable approach
  # in extra.css is the load-bearing piece on the community edition.
  status:
    scaffold: Scaffold — placeholder, not yet implemented
    built: Built — implementation complete, awaiting review
    implemented: Implemented — the MicroSim works
    instrumented: Instrumented — the MicroSim emits xAPI events; add ?xapi=teaching to the URL to see them
    approved: Approved — tested and approved

  # Intelligent-textbook URI scheme (see
  # https://dmccreary.github.io/intelligent-textbooks/uri-scheme/)
  schema: https://dmccreary.github.io/intelligent-textbooks/ns/textbook/v1
  textbook_name: 'Power Generation and Distribution'
  textbook_version: '0.1'

  # Google Analytics — uncomment once a property ID exists:
  # analytics:
  #   provider: google
  #   property: G-XXXXXXXXXX
